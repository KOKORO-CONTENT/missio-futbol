const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(X.s), iterations: X.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(X.i) }, key, u8(X.d)));
  try { localStorage.setItem("mf-pass", pass); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f");
f.onsubmit = async ev => {
  ev.preventDefault();
  document.getElementById("e").textContent = "";
  try { await open(document.getElementById("p").value); }
  catch (e) { document.getElementById("e").textContent = "Contrasenya incorrecta"; }
};
// GitHub Pages fa que el navegador guardi la pàgina fins a 10 minuts: per no jugar amb una versió antiga,
// es torna a demanar la pàgina sense memòria cau i, si n'hi ha una de més nova, es fa servir aquella.
async function fresh() {
  try {
    const t = await fetch(location.pathname + "?nocache=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "");
    const m = t.match(/(?:let|const) X = ([{].*?[}]);/);
    if (m) X = JSON.parse(m[1]);
  } catch (e) {}
}
(async () => {
  await fresh();
  let saved = null; try { saved = localStorage.getItem("mf-pass"); } catch (e) {}
  if (saved) { try { return await open(saved); } catch (e) {} }
  f.hidden = false; document.getElementById("p").focus();
})();
