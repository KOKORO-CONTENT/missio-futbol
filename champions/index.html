<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quantes Champions?</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Filtre horitzontal: càmera a pantalla completa, un sticker de jugador enganxat al front (segueix el cap)
   i, a sota, els cinc botons del disseny (escenari 1920×1080 escalat a la pantalla). */
:root {
  color-scheme: dark;
  --ink: #0b0d0b;
  --plate: #0a0b08;
  --verd: #25e24b;
  --verd-fosc: #0f7a27;
  --vermell: #ff2d3f;
  --chalk: #f1f1f1;
  --dim: #b7c4b9;
  --display: "Kanit", "Arial Black", Impact, sans-serif;
  --text: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --u: 1vh;
}
@supports (height: 1dvh) { :root { --u: 1dvh; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--chalk); font-family: var(--text); user-select: none; -webkit-user-select: none; }
/* Marc 16:9 exacte (el mateix enquadrament que grava el mòbil): vídeo i grafismes hi encaixen sense retallar */
#cam { position: fixed; left: var(--fl, 0px); top: var(--ft, 0px); width: var(--fw, 100vw); height: var(--fh, 100vh); object-fit: contain; background: var(--ink); }
#cam.mirror { transform: scaleX(-1); }
.hud { position: fixed; left: var(--fl, 0px); top: var(--ft, 0px); width: var(--fw, 100vw); height: var(--fh, 100vh); overflow: hidden; }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; margin: -540px 0 0 -960px; transform: scale(var(--k, 1)); }

/* Sticker del front: es col·loca en píxels de pantalla a partir de la cara */
.sticker { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; pointer-events: none; z-index: 2; will-change: transform; }
.sticker img { display: block; height: 100%; width: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
.sticker.stop img { animation: stop .35s cubic-bezier(.2,.9,.3,1.6); }
@keyframes stop { from { transform: scale(1.18); } }

/* Botons de resposta (retalls del disseny) */
.opt { --s: .82; position: absolute; background: none; border: 0; padding: 0; cursor: pointer; transform: scale(var(--s)); transform-origin: 50% 90%; transition: transform .25s cubic-bezier(.2,.9,.3,1.4), filter .25s, opacity .25s; }
.opt img { width: 100%; height: 100%; display: block; pointer-events: none; }
.opt .bar { position: absolute; left: 12%; right: 8%; bottom: 2px; height: 12px; background: var(--verd); transform: scaleX(var(--p, 0)); transform-origin: left; box-shadow: 0 0 0 3px var(--ink); }
.opt.live { transform: scale(calc(var(--s) * 1.05)); filter: drop-shadow(0 0 14px var(--verd)); }
.opt.ok { transform: translateY(-26px) scale(calc(var(--s) * 1.14)); filter: drop-shadow(0 0 22px var(--verd)) drop-shadow(0 0 6px var(--verd)); z-index: 1; }
.opt.ko { transform: translateY(-10px) scale(calc(var(--s) * 1.06)); filter: hue-rotate(-118deg) saturate(1.6) drop-shadow(0 0 22px var(--vermell)); animation: shake .45s; z-index: 1; }
.opt.dim { opacity: .4; filter: grayscale(.8); }
@keyframes shake { 20%, 60% { margin-left: -14px; } 40%, 80% { margin-left: 14px; } }
.opt:focus-visible { outline: 5px solid var(--chalk); outline-offset: 4px; }

/* Marcador (estètica verd i negre) */
.score { position: absolute; left: 60px; top: 50px; display: flex; gap: 22px; }
.cnt { position: relative; display: grid; grid-template-columns: auto auto; align-items: center; gap: 14px; padding: 12px 34px 16px 30px; isolation: isolate; }
.cnt::before, .cnt::after { content: ""; position: absolute; clip-path: polygon(10% 0, 100% 0, 100% 68%, 90% 100%, 0 100%, 0 32%); z-index: -1; }
.cnt::before { inset: 0; background: var(--tone); }
.cnt::after { inset: 6px; background: var(--plate); }
.cnt.good { --tone: var(--verd); } .cnt.bad { --tone: var(--vermell); }
.cnt b { font: italic 900 70px/1 var(--display); font-variant-numeric: tabular-nums; }
.cnt small { font: italic 800 26px/1 var(--display); text-transform: uppercase; color: var(--tone); }
.cnt.bump { animation: bump .4s cubic-bezier(.2,.9,.3,1.6); }
@keyframes bump { from { transform: scale(1.25); } }

/* Panell de detall: amb quins equips ha guanyat les Champions */
.wins { position: absolute; left: 1430px; top: 250px; width: 440px; background: rgba(10,11,8,.94); border: 5px solid var(--verd); box-shadow: 0 0 0 5px var(--ink), 10px 10px 0 var(--verd-fosc); padding: 22px 26px 24px; animation: winsIn .4s cubic-bezier(.2,.9,.3,1.2); }
@keyframes winsIn { from { transform: translateX(60px); opacity: 0; } }
.wins h2 { margin: 0 0 4px; font: italic 900 38px/1 var(--display); text-transform: uppercase; }
.wins .total { margin: 0 0 16px; font: italic 800 26px/1 var(--display); text-transform: uppercase; color: var(--verd); }
.wins ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.wins li { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 18px; animation: winsIn .35s backwards; }
.wins .crest { width: 84px; height: 84px; display: grid; place-items: center; overflow: hidden; }
.wins .crest img { max-width: 76px; max-height: 76px; object-fit: contain; }
.wins .crest .shield { width: 66px; height: 76px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
.wins .crest span { width: 100%; height: 100%; display: grid; place-items: center; background: var(--chalk); color: var(--ink); clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%); font: italic 900 32px/1 var(--display); text-transform: uppercase; text-align: center; padding: 0 8px; overflow: hidden; }
.wins .n { font: italic 900 76px/1 var(--display); }
.wins .club { display: block; font: 700 22px/1.1 var(--text); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.wins .none { font: italic 900 46px/1 var(--display); text-transform: uppercase; color: var(--dim); }

/* Controls (no surten a l'export) */
.ctrl { position: absolute; font: italic 900 30px/1 var(--display); text-transform: uppercase; background: var(--plate); color: var(--chalk); border: 4px solid var(--verd); padding: 12px 24px 15px; cursor: pointer; transform: skewX(-8deg); box-shadow: 6px 6px 0 var(--verd-fosc); }
#reset { right: 60px; top: 56px; }
#saveBtn { right: 60px; top: 140px; font-size: 22px; padding: 9px 18px 11px; border-width: 3px; }
.ctrl:focus-visible { outline: 4px solid var(--chalk); outline-offset: 4px; }
.hint { position: absolute; left: 0; right: 0; top: 735px; text-align: center; pointer-events: none; }
.hint span { display: inline-block; background: rgba(11,13,11,.82); padding: 10px 22px 12px; border: 3px solid var(--verd); font: italic 800 30px/1.1 var(--display); text-transform: uppercase; }

/* Mode render: només grafismes sobre transparent */
html.render, html.render body { background: transparent; }
html.render #cam, html.render #intro, html.render .hint, html.render .ctrl, html.render .rotate { display: none !important; }

/* Pantalla d'inici */
.panel { background: rgba(11,13,11,.94); border: 5px solid var(--verd); box-shadow: 0 0 0 5px var(--ink), 10px 10px 0 var(--verd-fosc); text-align: center; display: flex; flex-direction: column; align-items: center; }
#intro { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(calc(104 * var(--u)), 90vw); padding: calc(3.5 * var(--u)); gap: calc(2.2 * var(--u)); border-width: calc(.6 * var(--u)); z-index: 5; }
#intro h1 { margin: 0; font: italic 900 calc(8 * var(--u))/1 var(--display); text-transform: uppercase; }
#intro h1 b { color: var(--verd); font-weight: inherit; }
#intro p { margin: 0; font-size: calc(3.5 * var(--u)); line-height: 1.25; max-width: 42ch; }
.big { font: italic 900 calc(5 * var(--u))/1 var(--display); text-transform: uppercase; background: var(--verd); color: var(--ink); border: 0; padding: calc(2 * var(--u)) calc(6 * var(--u)) calc(2.5 * var(--u)); cursor: pointer; transform: skewX(-8deg); }
.row { display: flex; gap: calc(2 * var(--u)); flex-wrap: wrap; justify-content: center; }
.mini { font: 700 calc(3 * var(--u))/1 var(--text); letter-spacing: .08em; text-transform: uppercase; background: var(--ink); color: var(--chalk); border: calc(.3 * var(--u)) solid var(--dim); padding: calc(1.4 * var(--u)) calc(3 * var(--u)); cursor: pointer; }
#camSel { font: 700 calc(3 * var(--u))/1 var(--text); background: var(--ink); color: var(--chalk); border: calc(.3 * var(--u)) solid var(--verd); padding: calc(1.2 * var(--u)) calc(2 * var(--u)); max-width: 80vw; }
.mini[aria-pressed="true"] { border-color: var(--verd); color: var(--verd); }
.big:focus-visible, .mini:focus-visible { outline: 4px solid var(--chalk); outline-offset: 4px; }

.rotate { display: none; position: fixed; inset: 0; z-index: 9; background: var(--ink); place-items: center; text-align: center; padding: 24px; font: italic 900 1.8rem/1.15 var(--display); text-transform: uppercase; }
@media (orientation: portrait) { .rotate { display: grid; } }
@media (prefers-reduced-motion: reduce) { .sticker.stop img, .opt.ko, .cnt.bump { animation: none; } .opt { transition: none; } }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>

<div class="hud" id="hud" hidden>
  <div class="sticker" id="sticker" hidden><img id="stickerImg" alt=""></div>
  <div class="stage" id="stage">
    <div class="score">
      <div class="cnt good" id="cntOk"><b id="ok">0</b><small>Encerts</small></div>
      <div class="cnt bad" id="cntKo"><b id="ko">0</b><small>Errades</small></div>
    </div>
    <button class="ctrl" id="reset" type="button">Reinicia</button>
    <button class="ctrl" id="saveBtn" type="button">Desa la gravació</button>
    <div class="hint" id="hint" hidden><span id="hintTxt"></span></div>
    <div class="wins" id="wins" hidden><h2 id="winsName"></h2><p class="total" id="winsTotal"></p><ul id="winsRows"></ul></div>
    <div id="opts"></div>
  </div>
</div>

<div class="panel" id="intro">
  <h1>Quantes <b>Champions</b>?</h1>
  <p>Toca la pantalla i la ruleta de jugadors es posarà al teu front. Quan s'aturi, posa el dit sobre quantes Champions té i aguanta un moment.</p>
  <div class="row">
    <button class="mini" id="camFront" type="button" aria-pressed="false">Mirall (càmera frontal)</button>
    <button class="mini" id="camBack" type="button" aria-pressed="true">Sense mirall</button>
  </div>
  <label for="camSel" hidden id="camLbl" style="font-size:calc(2.6 * var(--u));letter-spacing:.08em;text-transform:uppercase">Càmera</label>
  <select id="camSel" hidden></select>
  <button class="big" id="startBtn" type="button">Comença</button>
  <button class="mini" id="lastBtn" type="button" hidden>Baixa l'última gravació</button>
</div>

<div class="rotate">Gira el mòbil<br>en horitzontal</div>

<script type="module">
// Llista definitiva (en aquest ordre i sense repetir). Champions League guanyades com a jugador/a, per equip.
// [nom, fitxer de stickers/, [[equip, Champions], ...]]   (els escuts van a escuts/<equip en minúscules i guions>.png)
const PLAYERS = [
  ["Karim Benzema", "karim-benzema", [["Real Madrid", 5]]],
  ["Lamine Yamal", "lamine-yamal", []],
  ["Thibaut Courtois", "thibaut-courtois", [["Real Madrid", 2]]],
  ["Aitana Bonmatí", "aitana-bonmati", [["Barcelona", 4]]],
  ["Kylian Mbappé", "kylian-mbappe", []],
  ["Rodri", "rodri", [["Manchester City", 1]]],
  ["Oleguer Presas", "oleguer-presas", [["Barcelona", 1]]],
  ["Philippe Coutinho", "philippe-coutinho", [["Bayern", 1]]],
  ["Cristiano Ronaldo", "cristiano-ronaldo", [["Manchester United", 1], ["Real Madrid", 4]]],
  ["Ewa Pajor", "ewa-pajor", [["Barcelona", 1]]],
  ["Nacho Fernández", "nacho-fernandez", [["Real Madrid", 6]]],
  ["Lionel Messi", "lionel-messi", [["Barcelona", 4]]],
  ["Neymar", "neymar", [["Barcelona", 1]]],
  ["Clàudia Pina", "claudia-pina", [["Barcelona", 3]]],
  ["Oriol Romeu", "oriol-romeu", [["Chelsea", 1]]],
  ["Andrés Iniesta", "andres-iniesta", [["Barcelona", 4]]],
  ["Salma Paralluelo", "salma-paralluelo", [["Barcelona", 3]]],
  ["Ousmane Dembélé", "ousmane-dembele", [["PSG", 2]]],
  ["Ronaldo Nazário", "ronaldo-nazario", []],
  ["Gianluigi Buffon", "gianluigi-buffon", []],
  ["Cata Coll", "cata-coll", [["Barcelona", 4]]],
  ["Harry Kane", "harry-kane", []],
  ["Zlatan Ibrahimović", "zlatan-ibrahimovic", []],
  ["Lucy Bronze", "lucy-bronze", [["Olympique Lyonnais", 3], ["Barcelona", 2]]],
  ["Andreas Christensen", "andreas-christensen", [["Chelsea", 1]]],
  ["Isco", "isco", [["Real Madrid", 5]]],
  ["Robert Lewandowski", "robert-lewandowski", [["Bayern", 1]]],
  ["Ferran Torres", "ferran-torres", []],
  ["Mariona Caldentey", "mariona-caldentey", [["Barcelona", 3], ["Arsenal", 1]]],
  ["Antoine Griezmann", "antoine-griezmann", []],
  ["Erling Haaland", "erling-haaland", [["Manchester City", 1]]],
  ["Bojan Krkić", "bojan-krkic", [["Barcelona", 2]]],
  ["Ronaldinho", "ronaldinho", [["Barcelona", 1]]],
  ["Ona Batlle", "ona-batlle", [["Barcelona", 2]]],
  ["Mohamed Salah", "mohamed-salah", [["Liverpool", 1]]],
  ["Pierre-Emerick Aubameyang", "pierre-emerick-aubameyang", []],
  ["Francesco Totti", "francesco-totti", []],
  ["Gerard Piqué", "gerard-pique", [["Manchester United", 1], ["Barcelona", 3]]],
  ["Megan Rapinoe", "megan-rapinoe", []],
  ["Jana Fernández", "jana-fernandez", [["Barcelona", 3]]]
].map(([name, file, wins]) => ({ name, file, wins, ucl: wins.reduce((s, w) => s + w[1], 0) }));

// Botons del disseny: posició a l'escenari 1920×1080 (cantonada i mida del retall)
const OPTS = [
  { x: 140,  y: 821, w: 333, h: 226 },   // x0
  { x: 473,  y: 816, w: 316, h: 229 },   // x1
  { x: 789,  y: 818, w: 319, h: 227 },   // x2
  { x: 1108, y: 820, w: 331, h: 226 },   // x3
  { x: 1439, y: 812, w: 339, h: 233 }    // x4+
];
const STAGE_W = 1920, STAGE_H = 1080;
const HOLD_MS = 750, NEAR = 0.04;
const SPIN_STEPS = 20;          // cares que passen abans d'aturar-se
const answerOf = p => Math.min(p.ucl, 4);   // 4, 5, 6... van totes a "x4+"

const $ = id => document.getElementById(id);
const RENDER = new URLSearchParams(location.search).has("render");
const reduced = !RENDER && matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = { t: 0, timers: [], seq: 0 };
const later = (fn, ms) => RENDER ? clock.timers.push({ at: clock.t + ms, fn, n: clock.seq++ }) : setTimeout(fn, ms);
const src = f => "stickers/" + f + ".png";

let phase = "intro";            // intro | idle | spin | answer | reveal
let current = null, ok = 0, ko = 0, pool = [];
let facing = "environment", faceLm = null, handLm = null, stream = null;
let holdIdx = -1, holdStart = 0, needNeutral = false;

// --- Gravació de la partida -------------------------------------------------------------
let log = null, t0 = 0, lastFill = "", lastPose = 0;
function rec(e, extra) {
  if (RENDER || !log) return;
  log.events.push(Object.assign({ t: Math.round(performance.now() - t0), e }, extra));
  if (e !== "fill" && e !== "pose") try { localStorage.setItem("champions-last", JSON.stringify(stamp(log))); } catch (err) {}
}
function stamp(l) { l.viewport = { w: STAGE_W, h: STAGE_H }; l.duration = Math.round(performance.now() - t0); return l; }
function download(l) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(l)], { type: "application/json" }));
  a.download = "champions-" + l.started.slice(0, 19).replace(/[:T]/g, "-") + ".json";
  document.body.appendChild(a); a.click(); a.remove();
}

// --- Escenari i botons --------------------------------------------------------------------
// Rectangle 16:9 centrat a la finestra on van la càmera i els grafismes.
const frame = { l: 0, t: 0, w: 1920, h: 1080 };
function fitStage() {
  const W = innerWidth, H = innerHeight;
  frame.w = Math.min(W, H * STAGE_W / STAGE_H); frame.h = frame.w * STAGE_H / STAGE_W;
  frame.l = (W - frame.w) / 2; frame.t = (H - frame.h) / 2;
  const r = document.documentElement.style;
  r.setProperty("--fl", frame.l + "px"); r.setProperty("--ft", frame.t + "px");
  r.setProperty("--fw", frame.w + "px"); r.setProperty("--fh", frame.h + "px");
  $("stage").style.setProperty("--k", frame.w / STAGE_W);
}
addEventListener("resize", fitStage);
fitStage();
OPTS.forEach((o, i) => {
  const b = document.createElement("button");
  b.className = "opt"; b.id = "opt" + i; b.type = "button";
  b.setAttribute("aria-label", i === 4 ? "4 o més" : String(i));
  Object.assign(b.style, { left: o.x + "px", top: o.y + "px", width: o.w + "px", height: o.h + "px" });
  b.innerHTML = '<img src="ui/btn-' + i + '.png" alt=""><i class="bar"></i>';
  b.onclick = e => { e.stopPropagation(); answer(i); };
  $("opts").appendChild(b);
});

function setFill(i, p) {
  const key = i + ":" + p.toFixed(2);
  if (key !== lastFill) { lastFill = key; rec("fill", { i, p: +p.toFixed(3) }); }
  OPTS.forEach((o, j) => {
    $("opt" + j).style.setProperty("--p", j === i ? p : 0);
    $("opt" + j).classList.toggle("live", j === i && p > 0);
  });
}
function clearOpts() { OPTS.forEach((o, j) => $("opt" + j).classList.remove("ok", "ko", "dim", "live")); setFill(-1, 0); }

function note(text) { if (RENDER) return; $("hintTxt").textContent = text; $("hint").hidden = !text; }
function bump(id) { const el = $(id); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

// --- Ruleta ------------------------------------------------------------------------------
// Els jugadors surten en l'ordre de la llista; quan s'acaben, cal reiniciar.
let nextIdx = 0;
function nextPool() { return nextIdx < PLAYERS.length ? nextIdx++ : -1; }
function showFace(i) { $("stickerImg").src = src(PLAYERS[i].file); }
// Interval entre cares: comença molt ràpid i frena al final.
const stepDelay = k => 40 + Math.pow(k / SPIN_STEPS, 3) * 230;

function spin(seq) {
  if (phase !== "idle" && phase !== "reveal") return;
  if (!seq) {
    const target = nextPool();
    if (target < 0) { note("Ja han sortit tots els jugadors. Toca Reinicia."); return; }
    seq = Array.from({ length: SPIN_STEPS - 1 }, () => Math.floor(Math.random() * PLAYERS.length));
    seq.push(target);
  }
  rec("spin", { seq });
  phase = "spin"; current = null;
  clearOpts(); note(""); $("wins").hidden = true;
  $("sticker").classList.remove("stop");
  let k = 0;
  const tick = () => {
    showFace(seq[k]);
    if (k === seq.length - 1) {
      current = PLAYERS[seq[k]];
      const s = $("sticker"); s.classList.remove("stop"); void s.offsetWidth; s.classList.add("stop");
      phase = "answer"; needNeutral = true;
      return;
    }
    later(tick, stepDelay(k++));
  };
  tick();
}

// --- Resposta ----------------------------------------------------------------------------
function answer(i) {
  if (phase !== "answer") return;
  rec("answer", { i });
  phase = "reveal";
  setFill(-1, 0);
  const right = answerOf(current);
  OPTS.forEach((o, j) => { if (j !== i && j !== right) $("opt" + j).classList.add("dim"); });
  $("opt" + right).classList.add("ok");
  if (i !== right) { $("opt" + i).classList.add("ko"); ko++; $("ko").textContent = ko; bump("cntKo"); }
  else { ok++; $("ok").textContent = ok; bump("cntOk"); }
  showWins(current);
}

const slugify = s => s.normalize("NFKD").replace(/[^\x00-\x7f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// Sigla que es mostra si no hi ha escut a escuts/
const CODES = { "Real Madrid": "RMA", "Barcelona": "FCB", "Manchester United": "MUN", "Manchester City": "MCI", "Chelsea": "CHE", "Bayern": "BAY", "PSG": "PSG", "Olympique Lyonnais": "OL", "Arsenal": "ARS", "Liverpool": "LIV" };
const code = c => CODES[c] || c.slice(0, 3).toUpperCase();
// Escut provisional (mentre no hi hagi el PNG oficial a escuts/)
window.shield = c => '<svg viewBox="0 0 100 116" class="shield"><path d="M50 4 94 18v38c0 28-19 46-44 56C25 102 6 84 6 56V18z" fill="#0a0b08" stroke="#25e24b" stroke-width="6"/><text x="50" y="68" text-anchor="middle" font-family="Kanit, sans-serif" font-style="italic" font-weight="900" font-size="' + (c.length > 3 ? 24 : 30) + '" fill="#f1f1f1">' + c + '</text></svg>';
function showWins(p) {
  $("winsName").textContent = p.name;
  $("winsTotal").textContent = p.ucl === 1 ? "1 Champions" : p.ucl + " Champions";
  $("winsRows").innerHTML = p.wins.length
    ? p.wins.map(([club, n], k) =>
        '<li style="animation-delay:' + (150 + k * 120) + 'ms"><div class="crest"><img src="escuts/' + slugify(club) + '.png" alt="" data-code="' + code(club) + '" onerror="this.outerHTML=shield(this.dataset.code)"></div>' +
        '<div><span class="n">x' + n + '</span><span class="club">' + escHtml(club) + '</span></div></li>').join("")
    : '<li><span class="none">Cap ni una</span></li>';
  const w = $("wins"); w.hidden = true; void w.offsetWidth; w.hidden = false;
}

function reset() {
  rec("reset");
  ok = ko = 0; nextIdx = 0; current = null; $("wins").hidden = true;
  $("ok").textContent = 0; $("ko").textContent = 0;
  clearOpts();
  $("sticker").hidden = true;
  phase = "idle";
}

// --- Seguiment del cap i de la mà ---------------------------------------------------------
let mirrored = false;
function toScreen(pt, video) {
  const W = frame.w, H = frame.h, vw = video.videoWidth, vh = video.videoHeight;
  const k = Math.min(W / vw, H / vh);
  const x = pt.x * vw * k + (W - vw * k) / 2, y = pt.y * vh * k + (H - vh * k) / 2;
  return { x: frame.l + (mirrored ? W - x : x), y: frame.t + y };
}

// Posa el sticker (posició del peu, alçada i gir; tot en fraccions de pantalla perquè l'export ho pugui reproduir).
let pose = null;
const FIXED_POSE = { x: .5, y: .36, h: .3, r: 0 };
function applyPose(p) {
  const s = $("sticker");
  if (!p || !p.h) { s.hidden = true; return; }
  if (phase === "intro" || phase === "idle") { s.hidden = true; return; }
  s.hidden = false;
  const W = frame.w, H = frame.h, h = p.h * H;
  s.style.height = h + "px";
  const w = s.offsetWidth || h;
  s.style.transform = `translate(${p.x * W - w / 2}px, ${p.y * H - h}px) rotate(${p.r}deg)`;
}

function faceToPose(lm, video) {
  const top = toScreen(lm[10], video), chin = toScreen(lm[152], video);
  const eL = toScreen(lm[33], video), eR = toScreen(lm[263], video);
  const fh = Math.hypot(chin.x - top.x, chin.y - top.y);
  const ux = (top.x - chin.x) / fh, uy = (top.y - chin.y) / fh;        // vector cap amunt del cap
  const foot = { x: top.x + ux * fh * 0.08, y: top.y + uy * fh * 0.08 };
  let r = Math.atan2(eR.y - eL.y, eR.x - eL.x) * 180 / Math.PI;
  if (r > 90) r -= 180; if (r < -90) r += 180;
  return { x: (foot.x - frame.l) / frame.w, y: (foot.y - frame.t) / frame.h, h: fh * 1.05 / frame.h, r };
}

function smooth(a, b, k) { return a && a.h ? { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, h: a.h + (b.h - a.h) * k, r: a.r + (b.r - a.r) * k } : b; }

function handPick(lms, video) {
  for (const lm of lms) {
    const tip = toScreen(lm[8], video);
    for (let j = 0; j < OPTS.length; j++) {
      const r = $("opt" + j).getBoundingClientRect(), m = r.width * NEAR;
      if (tip.x > r.left - m && tip.x < r.right + m && tip.y > r.top - m && tip.y < r.bottom + m) return j;
    }
  }
  return -1;
}

function onHand(idx, now) {
  if (phase !== "answer") return;
  if (needNeutral) { if (idx < 0) needNeutral = false; holdIdx = -1; setFill(-1, 0); return; }
  if (idx !== holdIdx) { holdIdx = idx; holdStart = now; }
  if (idx < 0) { setFill(-1, 0); return; }
  const p = Math.min(1, (now - holdStart) / HOLD_MS);
  setFill(idx, p);
  if (p >= 1) { holdIdx = -1; answer(idx); }
}

let faceModel = null, handModel = null, tickN = 0;
function loop() {
  const video = $("cam"), now = performance.now();
  if (video.readyState >= 2 && phase !== "intro") {
    if (faceModel) {
      try { const r = faceModel.detectForVideo(video, now); faceLm = r.faceLandmarks && r.faceLandmarks[0]; } catch (e) {}
      pose = faceLm ? smooth(pose, faceToPose(faceLm, video), .55) : null;
    }
    // La mà només cal mentre es respon; s'analitza un fotograma de cada dos per no carregar el mòbil.
    if (handModel && phase === "answer" && (tickN++ & 1)) {
      try { const r = handModel.detectForVideo(video, now); handLm = r.landmarks || []; } catch (e) { handLm = []; }
      onHand(handPick(handLm, video), now);
    }
  }
  // Sense seguiment de cara (càmera o model no disponibles), el sticker queda fix a dalt al mig.
  if (!faceModel && phase !== "intro") pose = FIXED_POSE;
  if (phase !== "intro") {
    applyPose(pose);
    if (now - lastPose > 33) { lastPose = now; rec("pose", pose ? { x: +pose.x.toFixed(4), y: +pose.y.toFixed(4), h: +pose.h.toFixed(4), r: +pose.r.toFixed(1) } : { h: 0 }); }
  }
  requestAnimationFrame(loop);
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const dev = $("camSel").value;
  const video0 = dev ? { deviceId: { exact: dev } } : { facingMode: facing };
  stream = await navigator.mediaDevices.getUserMedia({ video: Object.assign(video0, { width: { ideal: 1920 }, height: { ideal: 1080 } }), audio: false });
  const video = $("cam");
  mirrored = facing === "user";
  video.classList.toggle("mirror", mirrored);
  video.srcObject = stream;
  try { localStorage.setItem("champions-cam", dev); } catch (e) {}
  await video.play();
}

async function loadModels() {
  const V = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const { FaceLandmarker, HandLandmarker, FilesetResolver } = await import(V + "/vision_bundle.mjs");
  const files = await FilesetResolver.forVisionTasks(V + "/wasm");
  const M = "https://storage.googleapis.com/mediapipe-models/";
  faceModel = await FaceLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: M + "face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
    runningMode: "VIDEO", numFaces: 1
  });
  handModel = await HandLandmarker.createFromOptions(files, {
    baseOptions: { modelAssetPath: M + "hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU" },
    runningMode: "VIDEO", numHands: 2
  });
}

// Pitet de sincronia: sona just al segon 0 de la gravació. El micròfon del mòbil el capta i a l'edició
// es fa coincidir amb l'inici del grafisme exportat.
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 1000; g.gain.value = 0.6;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.25);
  } catch (e) {}
}

function start() {
  const root = document.documentElement;
  try { root.requestFullscreen && root.requestFullscreen().catch(() => {}); } catch (e) {}
  try { screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {}); } catch (e) {}
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  $("intro").hidden = true; $("hud").hidden = false;
  fitStage();
  log = { v: 1, game: "champions", started: new Date().toISOString(), events: [] };
  t0 = performance.now();
  beep();
  reset();
  requestAnimationFrame(loop);
  (async () => {
    try { if (!navigator.mediaDevices) throw 0; await startCamera(); }
    catch (e) { return note("No s'ha pogut obrir la càmera"); }
    try { await loadModels(); }
    catch (e) { note("No s'ha pogut carregar el seguiment. Toca els botons per respondre."); }
  })();
}

function pickCam(f) {
  facing = f;
  $("camFront").setAttribute("aria-pressed", f === "user");
  $("camBack").setAttribute("aria-pressed", f !== "user");
}
$("camFront").onclick = () => pickCam("user");
$("camBack").onclick = () => pickCam("environment");
$("startBtn").onclick = start;
// Llista de càmeres (p. ex. l'iPhone amb Càmera de Continuïtat). Els noms només surten un cop s'ha donat permís.
async function listCams() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    if (devs.length < 2) return;
    let saved = ""; try { saved = localStorage.getItem("champions-cam") || ""; } catch (e) {}
    $("camSel").innerHTML = '<option value="">Per defecte</option>' + devs.map((d, k) =>
      '<option value="' + d.deviceId + '"' + (d.deviceId === saved ? " selected" : "") + '>' + (d.label || "Càmera " + (k + 1)).replace(/</g, "&lt;") + '</option>').join("");
    $("camSel").hidden = $("camLbl").hidden = false;
  } catch (e) {}
}
if (!RENDER && navigator.mediaDevices) {
  listCams();
  navigator.mediaDevices.addEventListener && navigator.mediaDevices.addEventListener("devicechange", listCams);
}
$("reset").onclick = e => { e.stopPropagation(); reset(); };
$("saveBtn").onclick = e => { e.stopPropagation(); if (log) download(stamp(log)); };
// Tocar qualsevol lloc de la pantalla fa girar la ruleta.
$("hud").addEventListener("click", () => { if (phase === "idle" || phase === "reveal") spin(); });
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); if (phase === "idle" || phase === "reveal") spin(); }
  if (e.key >= "0" && e.key <= "4") answer(+e.key);
  if (e.key === "r") reset();
  if (e.key === "s" && log) download(stamp(log));
});
try {
  const last = localStorage.getItem("champions-last");
  if (last) { $("lastBtn").hidden = false; $("lastBtn").onclick = () => download(JSON.parse(last)); }
} catch (err) {}
PLAYERS.forEach(p => { new Image().src = src(p.file); });

if (RENDER) {
  document.documentElement.classList.add("render");

  // Export en mirall (--mirall): cada peça canvia de costat però no s'inverteix, perquè el grafisme quadri
  // amb el vídeo de la càmera frontal del mòbil (que no fa mirall) i els textos es llegeixin bé.
  const MIRROR = new URLSearchParams(location.search).has("mirall");
  function mirrorLayout(sels, W) {
    const st = $("stage").getBoundingClientRect(), k = st.width / W;
    for (const el of document.querySelectorAll(sels)) {
      // Es mesura la peça visible (el camp és .pitch dins de .field) sense animacions d'entrada.
      const m = el.querySelector(":scope > .pitch") || el;
      const hid = el.hidden, anim = m.style.animation;
      el.hidden = false; m.style.animation = "none";
      const r = m.getBoundingClientRect();
      el.hidden = hid; m.style.animation = anim;
      const x = (r.left - st.left) / k, w = r.width / k;
      el.style.translate = (W - 2 * x - w) + "px 0";
    }
  }
  const started = new Map();
  let ev = [], ei = 0;
  const track = at => { for (const a of document.getAnimations()) if (!started.has(a)) { a.pause(); started.set(a, at); } };
  const run = {
    reset: () => reset(),
    spin: e => spin(e.seq),
    answer: e => answer(e.i),
    fill: e => { if (phase === "answer") setFill(e.i, e.p); },
    pose: e => { pose = e.h ? (MIRROR ? Object.assign({}, e, { x: 1 - e.x, r: -e.r }) : e) : null; applyPose(pose); }
  };
  const settled = () => Promise.all([...document.images].filter(i => !i.complete).map(i => new Promise(r => { i.onload = i.onerror = r; })));
  window.renderInit = async session => {
    ev = session.events; ei = 0;
    $("intro").hidden = true; $("hud").hidden = false;
    fitStage();
    await document.fonts.ready;
    await settled();
    if (MIRROR) mirrorLayout(".score, #wins, .opt", STAGE_W);
    return ev.length ? ev[ev.length - 1].t : 0;
  };
  window.renderFrame = async t => {
    for (;;) {
      clock.timers.sort((a, b) => a.at - b.at || a.n - b.n);
      const tm = clock.timers[0], e = ev[ei];
      const tt = tm && tm.at <= t ? tm.at : Infinity, te = e && e.t <= t ? e.t : Infinity;
      if (tt === Infinity && te === Infinity) break;
      if (tt <= te) { clock.timers.shift(); clock.t = tt; tm.fn(); }
      else { ei++; clock.t = te; if (run[e.e]) run[e.e](e); }
      track(clock.t);
    }
    clock.t = t;
    for (const [a, at] of started) {
      if (a.playState === "idle") { started.delete(a); continue; }
      const end = a.effect ? a.effect.getComputedTiming().endTime : 0;
      if (t - at >= end) { a.finish(); started.delete(a); } else a.currentTime = t - at;
    }
    applyPose(pose);
    await settled();
    return true;
  };
}
</script>
</body>
