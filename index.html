<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0d0b; color: #f1f1f1; font-family: "Arial Narrow", Arial, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
  form { display: grid; gap: 18px; justify-items: center; width: min(100%, 420px); background: #0a0b08; border: 4px solid #25e24b; box-shadow: 10px 10px 0 #0f7a27; padding: 32px 26px; }
  h1 { margin: 0; font: italic 900 40px/1 "Arial Black", Impact, sans-serif; text-transform: uppercase; text-align: center; }
  h1 span { color: #25e24b; }
  label { font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: #b7c4b9; }
  input { width: 100%; font-size: 22px; padding: 12px 14px; background: #0b0d0b; color: #f1f1f1; border: 3px solid #25e24b; }
  button { font: italic 900 26px/1 "Arial Black", Impact, sans-serif; text-transform: uppercase; background: #25e24b; color: #0b0d0b; border: 0; padding: 14px 40px 16px; cursor: pointer; transform: skewX(-8deg); }
  input:focus-visible, button:focus-visible { outline: 3px solid #f1f1f1; outline-offset: 3px; }
  p { margin: 0; min-height: 1.2em; color: #ff2d3f; font-size: 18px; }
  [hidden] { display: none !important; }
</style>
</head>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u8(X.s), iterations: X.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8(X.i) }, key, u8(X.d)));
  try { localStorage.setItem("mf-pass", pass); } catch (e) {}
  document.open(); document.write(html); document.close();
}
const f = document.getElementById("f");
f.onsubmit = async ev => {
  ev.preventDefault();
  document.getElementById("e").textContent = "";
  try { await open(document.getElementById("p").value); }
  catch (e) { document.getElementById("e").textContent = "Contrasenya incorrecta"; }
};
(async () => {
  let saved = null; try { saved = localStorage.getItem("mf-pass"); } catch (e) {}
  if (saved) { try { return await open(saved); } catch (e) {} }
  f.hidden = false; document.getElementById("p").focus();
})();
